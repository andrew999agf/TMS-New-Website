name = "patriot-control-hub"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# One Durable Object class = the single tournament "room" (state cache + relay).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "ControlRoom"

[[migrations]]
tag = "v1"
# SQLite-backed Durable Object (required on the Workers free plan; works on paid
# too). The ControlRoom uses the standard storage API, which SQLite DOs support.
new_sqlite_classes = ["ControlRoom"]

# Secret (do NOT put it here) — set with:
#   wrangler secret put CONTROL_SECRET
# It must be the SAME value as the website's CONTROL_SECRET env var, because the
# website mints the operator/switcher tokens and this worker verifies them.
