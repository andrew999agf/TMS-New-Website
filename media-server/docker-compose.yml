# Patriot Series 250 media server: MediaMTX (WHIP/WHEP) + Caddy (auto-HTTPS).
# Host networking keeps WebRTC ICE simple. Linux host required.
#
#   docker compose up -d

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
