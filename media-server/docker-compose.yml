# Patriot Series 250 home media server — MediaMTX (video).
# Windows/Docker Desktop friendly: explicit published ports (no host networking).
# The Cloudflare Tunnel runs as a separate native program (see README), not here.
#
#   copy .env.example to .env and fill it in, then:
#   docker compose up -d

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      # Advertise your home public IP in WebRTC ICE candidates so viewers and the
      # operator can reach the media via the forwarded port. Set PUBLIC_IP in .env.
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_IP}
    ports:
      # WHIP/WHEP signaling — the local Cloudflare Tunnel connects here.
      - "8889:8889"
      # WebRTC media — forward THIS port (UDP, and TCP as fallback) on your router.
      - "8189:8189/udp"
      - "8189:8189/tcp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
