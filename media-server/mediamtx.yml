# MediaMTX config for Patriot Series 250 (WHIP in / WHEP out).
# Only the non-default settings we care about are listed.

###############################################
# Authentication
###############################################
authMethod: internal
authInternalUsers:
  # Public viewers: anonymous read (so anyone can watch the broadcast).
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path: patriot
  # The operator's switcher: publish only, credentials carried in the WHIP URL
  # (?user=publisher&pass=...). CHANGE THIS PASSWORD.
  - user: publisher
    pass: CHANGE_ME_PUBLISH_SECRET
    ips: []
    permissions:
      - action: publish
        path: patriot
  # API/metrics stay local-only by default; no extra users needed.

###############################################
# WebRTC (WHIP ingest + WHEP playback)
###############################################
webrtc: yes
webrtcAddress: :8889
# TLS is terminated by Caddy in front, so MediaMTX speaks plain HTTP internally.
webrtcEncryption: no
webrtcAllowOrigin: "*"
# ICE media ports (open these on the firewall, UDP + TCP).
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# Advertise the public hostname so browsers send media to the reachable address.
# >>> SET THIS to your subdomain (must resolve to this server's public IP). <<<
webrtcAdditionalHosts:
  - live.example.com

###############################################
# Other protocols
###############################################
# RTMP kept on as a fallback ingest if the operator ever pushes RTMP instead.
rtmp: yes
# HLS off for now (WHEP is the primary playback path). Flip to `yes` to scale
# to very large audiences later.
hls: no

###############################################
# Paths
###############################################
paths:
  # Single broadcast path; published to via WHIP, read via WHEP.
  patriot:
